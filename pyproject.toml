[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-v2sc"
version = "0.1.0"
description = "A lightweight hierarchical Verilog-to-SystemC modeling prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "prism_v2sc contributors" }
]
dependencies = [
  "pyverilog>=1.3.0"
]

[project.scripts]
prism-v2sc = "prism_v2sc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=build/pytest_tmp"
